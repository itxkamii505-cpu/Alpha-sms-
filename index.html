<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Panel — ALPHA SMS</title>
<meta name="description" content="Alpha SMS Owner Panel for OTP, virtual number management, and SMS live feeds">
<meta property="og:title" content="Owner Panel — ALPHA SMS">
<meta property="og:description" content="Alpha SMS Owner Panel for OTP, virtual number management, and SMS live feeds">
<link rel="icon" type="image/svg+xml" href="/static/img/alphasms-logo.svg">
<script>
(function(){
  try {
    var s = window.__BRAND_SETTINGS__;
    if (!s) {
      var c = localStorage.getItem('app_brand_settings');
      if (c) s = JSON.parse(c);
    }
    var hg = (s && s.header_gradient) || 'linear-gradient(180deg, #1b4332 0%, #143627 50%, #081c15 100%)';
    var tc = (s && s.header_text_color) || '#ffffff';
    var fw = (s && s.header_font_weight) || '700';
    var r = document.documentElement;
    r.style.setProperty('--header-gradient', hg);
    r.style.setProperty('--header-text-color', tc);
    r.style.setProperty('--header-font-weight', fw);
    r.style.setProperty('--brand-primary', '#166534');
    r.style.setProperty('--brand-hover', '#14532d');
    r.style.setProperty('--brand-accent', '#4ade80');
    r.style.setProperty('--zy-blue-top', '#166534');
    r.style.setProperty('--zy-blue-bot', '#14532d');
    r.style.setProperty('--zy-blue', '#166534');

    var st = document.createElement('style');
    st.id = 'zero-fouc-shield';
    st.textContent = ':root{--header-gradient:' + hg + ' !important;--header-text-color:' + tc + ' !important;--brand-primary:#166534 !important;--brand-hover:#14532d !important;}' +
      '.zy-header, .adminui .zy-header, .zy-header-row, .adminui .zy-header-row, .zy-side-head, .adminui .zy-side-head, .zy-side-foot, .adminui .zy-side-foot, .zy-user-menu .zy-um-head, .adminui .zy-user-menu .zy-um-head { background: ' + hg + ' !important; color: ' + tc + ' !important; }' +
      '.zy-head-title, .zy-role, .zy-welcome, .adminui .zy-user, .zy-user { color: ' + tc + ' !important; }' +
      '.zy-side, .adminui .zy-side, .zy-sidenav, .adminui .zy-sidenav { background: #ffffff !important; background-color: #ffffff !important; }';
    (document.head || document.documentElement).appendChild(st);
  } catch(e) {}
})();
</script>
<script src="/static/js/brand-theme.js"></script>
<script src="/static/js/speed-auth-guard.js"></script>
<script src="/static/js/speed-profile-security.js"></script>
<script>
  if (window.SpeedAuth) {
    window.SpeedAuth.enforce(['Owner', 'Admin']);
    window.SpeedAuth.initCrossTabWatcher(['Owner', 'Admin']);
  }
</script>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/cropper.min.css">
<link rel="stylesheet" href="/static/css/speed-panel.css">
<link rel="stylesheet" href="/static/css/speed-admin-skin.css">
</head>
<body class="light alphaui rmsui adminui">

<aside class="zy-side" id="sidebar">
  <div class="zy-side-head">
    <button class="zy-side-close" onclick="zyCloseSidebar()" aria-label="Close" type="button"><i class="fas fa-times"></i></button>
    <div class="zy-avatar-lg"><img id="zy-side-logo" src="/static/img/alphasms-logo.svg" onerror="this.onerror=null;this.src='/static/img/custom-logo.svg';" alt="ALPHA SMS"></div>
    <div class="zy-welcome">Welcome <span id="mgr-username-side">Kamran_Bhatti</span></div>
    <div class="zy-role" id="brand-role">Owner Panel</div>
    <div class="zy-clock" id="zy-clock">&mdash;</div>
  </div>
  <nav class="zy-sidenav" id="zy-sidenav"></nav>
  <div class="zy-side-foot"></div>
</aside>
<div class="zy-side-backdrop" id="zy-side-backdrop" onclick="zyCloseSidebar()"></div>

<div class="zy-main" id="main-wrapper">
  <header class="zy-header">
    <div class="zy-header-row">
      <div class="zy-head-left">
        <button class="zy-side-toggle" onclick="zyToggleSidebar()" title="Toggle Sidebar" aria-label="Toggle Sidebar"><i class="fas fa-bars"></i></button>
        <div class="zy-head-title" id="zy-logo"><span class="zy-panel-badge">ALPHA SMS</span></div>
      </div>
      <div class="zy-head-right">
        <div class="zy-user" onclick="zyToggleUser(event)" title="Profile & Account">
          <span id="mgr-username" style="display:none !important;">Kamran_Bhatti</span>
          <span class="zy-ava" title="Profile"><i class="fas fa-circle-user" style="font-size:22px;color:#ffffff;"></i></span>
        </div>
        <div class="zy-user-menu" id="zy-user-menu">
          <a onclick="loadPage('announcements')"><i class="fas fa-bell"></i> <span>Notifications</span> <span class="um-badge">2</span></a>
          <a onclick="loadPage('my-profile')"><i class="far fa-user"></i> <span>My Profile</span></a>
          <a onclick="loadPage('audit-logs')"><i class="far fa-file-lines"></i> <span>Activity</span></a>
          <div class="zy-um-divider"></div>
          <a class="zy-um-logout" onclick="doLogout()"><i class="fas fa-arrow-right-from-bracket"></i> <span>Logout</span></a>
        </div>
      </div>
    </div>
    <div class="zy-mega" id="zy-mega"></div>
  </header>

  <div class="zy-body">
    <div class="zy-crumb">
      <a onclick="loadPage('dashboard')">Home</a><span class="zy-sep">&raquo;</span><span id="breadcrumb">Dashboard</span>
    </div>
    <main class="page-content" id="page-content"></main>
  </div>
</div>

<span id="live-stat" style="display:none"></span>
<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/static/js/cropper.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/new_features.js"></script>
<script src="/static/js/speed-kit.js"></script>
<script src="/static/js/speed-admin.js"></script>
<script src="/static/js/speed-loginpanel.js"></script>
<script src="/static/js/speed-flash.js"></script>
<script src="/static/js/brand-theme.js"></script>
</body>
</html>
