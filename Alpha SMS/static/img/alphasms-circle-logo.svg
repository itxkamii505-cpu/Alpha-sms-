<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Radial Outer Dark Background Gradient -->
    <radialGradient id="circleBg" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Vibrant Alpha Blue Cyan Linear Gradient -->
    <linearGradient id="alphaBlueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="30%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Glowing Outer Ring Arc -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="100" cy="100" r="96" fill="url(#circleBg)" stroke="#1e293b" stroke-width="3"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Orbital Dynamic Wave Arc -->
  <path d="M 45,70 C 40,40 70,25 100,25 C 135,25 160,45 158,80" 
        fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 155,130 C 160,160 130,175 100,175 C 65,175 40,155 42,120" 
        fill="none" stroke="url(#alphaBlueCyan)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Center Telecom Chat Bubble with Alpha Core -->
  <g transform="translate(100, 82)">
    <!-- Speech Bubble -->
    <path d="M -30,-26 C -30,-40 -16,-50 0,-50 C 16,-50 30,-40 30,-26 C 30,-12 16,0 0,0 C -6,0 -12,-1 -17,-5 L -28,1 L -25,-10 C -28,-14 -30,-20 -30,-26 Z" 
          transform="translate(0, 20)"
          fill="url(#alphaBlueCyan)"/>

    <!-- 3 Chat Dots inside bubble -->
    <circle cx="-9" cy="-5" r="3.2" fill="#ffffff"/>
    <circle cx="0" cy="-5" r="3.2" fill="#ffffff"/>
    <circle cx="9" cy="-5" r="3.2" fill="#ffffff"/>
  </g>

  <!-- Typography: ALPHA SMS -->
  <text x="100" y="140" 
        text-anchor="middle"
        font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="2.5" 
        fill="url(#ringGrad)">ALPHA</text>

  <text x="100" y="157" 
        text-anchor="middle"
        font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
        font-size="11.5" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#38bdf8">SMS</text>
</svg>
