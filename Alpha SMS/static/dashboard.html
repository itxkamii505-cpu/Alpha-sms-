<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- the panel runs inside the iframe below; Chrome only honours the TOP-LEVEL
     viewport, so the 540px layout width has to be declared HERE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — ALPHA SMS</title>
<link rel="icon" type="image/svg+xml" href="/static/img/alphasms-logo.svg">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f1115; }
  #panel-frame { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #boot-msg {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#9ca3af; font-family:system-ui,sans-serif; font-size:14px;
  }
</style>
</head>
<body>

<div id="boot-msg"></div>
<iframe id="panel-frame" title="Dashboard" style="display:none;"></iframe>

<script src="/static/js/speed-auth-guard.js"></script>
<script>
(function () {
  function boot() {
    if (window.SpeedAuth) {
      if (!window.SpeedAuth.isLoggedIn()) {
        window.location.replace('/login');
        return;
      }
      const role = window.SpeedAuth.getActiveRole();
      window.location.replace(window.SpeedAuth.getRoleRedirect(role));
      return;
    }

    if (sessionStorage.getItem('admin_logged_in') !== '1') {
      window.location.href = '/login';
      return;
    }
    let user = {};
    try { user = JSON.parse(sessionStorage.getItem('admin_user') || '{}'); } catch (e) {}

    const role = (user.role || '').toLowerCase();
    if (role === 'testpanel') {
      window.location.href = '/testpanel';
      return;
    }
    if (role === 'manager') {
      window.location.replace('/ints/manager/SMSDashboard');
      return;
    }
    if (role === 'agent') {
      window.location.replace('/ints/agent/SMSDashboard');
      return;
    }
    if (role === 'client' || role === 'reseller') {
      window.location.replace('/ints/client/SMSDashboard');
      return;
    }
    window.location.replace('/owner');
  }

  boot();
})();
</script>
</body>
</html>
